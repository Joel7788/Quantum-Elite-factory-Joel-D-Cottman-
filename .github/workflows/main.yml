name: Quantum Elite Master Workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Unit Tests
        run: pytest --cov=. --cov-report=term-missing

  execute-pipeline:
    needs: unit-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'

      - name: Check Terraform Formatting
        run: terraform fmt -check -recursive

      - name: Validate Quantum Huntor Terraform Config
        # Remote state lives in a GCS bucket supplied at deploy time, so CI
        # validates the configuration without initializing the backend.
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Run Quantum Wholesaling Pipeline
        run: python "quantum elite wholesaleing pipeline.py"

      - name: Verify Pipeline Artifacts
        run: |
          test -f artifacts/telemetry.html
          ls artifacts/documents/*/*.txt >/dev/null

      - name: Upload Telemetry Dashboard
        uses: actions/upload-artifact@v4
        with:
          name: quantum-elite-telemetry
          path: artifacts/
          retention-days: 14

