name: Quantum Elite Master Workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Unit Tests
        run: pytest --cov=. --cov-report=term-missing

  execute-pipeline:
    needs: unit-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: '1.9.8'

      - name: Check Terraform Formatting
        run: terraform fmt -check -recursive

      - name: Validate Quantum Huntor Terraform Config
        # Remote state lives in a GCS bucket supplied at deploy time, so CI
        # validates the configuration without initializing the backend.
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Run Quantum Wholesaling Pipeline
        run: python "quantum elite wholesaleing pipeline.py"

      - name: Verify Pipeline Artifacts
        run: |
          test -f artifacts/telemetry.html
          ls artifacts/documents/*/*.txt >/dev/null

      - name: Upload Telemetry Dashboard
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quantum-elite-telemetry
          path: artifacts/
          retention-days: 14
